<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="查看 Retailrocket 歷史熱門商品，切換瀏覽、加購與購買前十名及實際計數。">
  <meta name="theme-color" content="#f3f6ee">
  <title>首頁熱門商品｜Retailrocket 互動推薦展示</title>
  <script>
    const originalQuery = new URLSearchParams(location.search);
    if (originalQuery.has("case") || originalQuery.has("mode")) {
      const productPage = new URL("./products/", location.href);
      productPage.search = location.search;
      productPage.hash = location.hash;
      location.replace(productPage);
    }
  </script>
  <link rel="stylesheet" href="./recommendation-demo/demo.css">
  <script src="./recommendation-demo/popularity.js" defer></script>
</head>
<body>
  <a class="skip" href="#rankings">跳到熱門榜單</a>
  <header class="masthead">
    <div class="frame masthead-inner">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        Retailrocket
      </a>
      <a class="repo-link" href="https://github.com/likaisuwork9616/smart-ecommerce-recommendation-system">GitHub 專案</a>
    </div>
  </header>

  <main class="frame">
    <nav class="showcase-nav" aria-label="互動推薦展示">
      <a href="./" aria-current="page">首頁熱門商品</a>
      <a href="./home-first-view/">新訪客首看榜</a>
      <a href="./products/">商品推薦案例</a>
      <a href="./k1-recency/">K1 也留一席</a>
    </nav>
    <section class="intro" aria-labelledby="title">
      <div>
        <h1 id="title">首頁熱門商品</h1>
        <p class="intro-copy">看看哪些商品最常被瀏覽、加購或買下。點選商品，即可查看它的相關推薦。</p>
      </div>
      <div class="snapshot popular-window">
        <span>訓練期間（UTC）</span>
        <strong id="popular-dates"></strong>
      </div>
    </section>

    <div class="demo popular-demo" id="rankings">
      <section class="results" id="popular-results" aria-labelledby="popular-heading" aria-busy="true">
        <div class="results-header">
          <h2 id="popular-heading">熱門瀏覽前十名</h2>
          <div class="mode-buttons" role="group" aria-label="熱門榜單">
            <button type="button" data-popular-mode="browse" aria-pressed="true" disabled>瀏覽</button>
            <button type="button" data-popular-mode="cart" aria-pressed="false" disabled>加購</button>
            <button type="button" data-popular-mode="purchase" aria-pressed="false" disabled>購買</button>
          </div>
        </div>
        <p class="message" id="popular-message" role="status">正在載入熱門商品…</p>
        <table class="ranking popular-ranking" id="popular-table" aria-labelledby="popular-heading" hidden>
          <thead>
            <tr><th scope="col">名次</th><th scope="col">匿名商品</th><th scope="col" id="popular-unit">瀏覽次數</th></tr>
          </thead>
          <tbody id="popular-rows"></tbody>
        </table>
        <p class="sr-only" id="popular-announcement" role="status" aria-atomic="true"></p>
        <noscript><p class="message">啟用 JavaScript 即可切換三種熱門榜單，或直接查看<a href="./recommendation-demo/popularity.json">三榜資料</a>。</p></noscript>
      </section>
      <section class="case-picker" aria-labelledby="method-heading">
        <h2 id="method-heading">熱門怎麼算？</h2>
        <p class="popular-method" id="popular-method">依訓練期間的瀏覽紀錄排序。</p>
      </section>
      <a class="analysis-link" id="popular-case-link" href="./products/?case=popular&amp;mode=browse">
        <span><strong>看商品 B 如何用熱門榜補位</strong><span>商品 B 沒有共同配對，看看它的十席從哪裡來。</span></span>
      </a>
    </div>
  </main>

  <footer class="frame credits">
    <p>三榜沿用商品推薦案例的匿名代號。每位訪客看到相同的歷史榜單。</p>
    <p><a href="https://www.kaggle.com/datasets/retailrocket/ecommerce-dataset">Roman Zykov／Retailrocket</a>
      <span aria-hidden="true">·</span>
      <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" rel="license">CC BY-NC-SA 4.0</a></p>
  </footer>
</body>
</html>
